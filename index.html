<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Hakim REDJEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="v3-styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>

  <!-- SVG filter library used by warp animation -->
  <svg class="fxlib" aria-hidden="true">
    <defs>
      <filter id="displace-soft" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.025" numOctaves="2" seed="3"/>
        <feDisplacementMap in="SourceGraphic" scale="22"/>
      </filter>
    </defs>
  </svg>

  <!-- Brand mark (top-left) -->
  <div class="brand-top">
    <div class="brand-blob"></div>
    <div class="brand-text">
      <div class="brand-name">HAKIM / PORTFOLIO</div>
      <div class="brand-sub">v.3.0</div>
    </div>
  </div>

  <!-- Top-right: clock + lang -->
  <div class="topright">
    <div class="tr-clock" id="clock">00:00:00</div>
    <div class="tr-lang">
      <button id="lang-en" class="active">EN</button>
      <button id="lang-fr">FR</button>
    </div>
  </div>

  <!-- Warp overlays -->
  <div id="warp" class="warp"></div>
  <div id="warp-scan" class="warp-scan"></div>
  <div id="warp-flash" class="warp-flash"></div>

  <!-- Screens -->
  <main>
    <section id="screen-hub"        class="screen active" data-screen-label="01 Hub"></section>
    <section id="screen-experience" class="screen"        data-screen-label="02 Experience"></section>
    <section id="screen-projects"   class="screen"        data-screen-label="03 Projects"></section>
    <section id="screen-skills"     class="screen"        data-screen-label="04 Skills"></section>
    <section id="screen-education"  class="screen"        data-screen-label="05 Education"></section>
  </main>

  <!-- Persistent dock — anywhere → anywhere -->
  <nav class="dock" aria-label="Navigation">
    <button class="dock-btn active" data-target="hub">
      <span class="glyph"></span><span>HUB</span>
    </button>
    <button class="dock-btn" data-target="experience">
      <span class="glyph"></span><span>EXP</span>
    </button>
    <button class="dock-btn" data-target="projects">
      <span class="glyph"></span><span>PROJ</span>
    </button>
    <button class="dock-btn" data-target="skills">
      <span class="glyph"></span><span>SKILL</span>
    </button>
    <button class="dock-btn" data-target="education">
      <span class="glyph"></span><span>EDU</span>
    </button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="v3-app.js"></script>
</body>
</html>
