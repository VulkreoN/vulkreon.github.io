name: Update Steam "now playing"

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch latest Steam activity
        run: node scripts/fetch-steam-now.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_VANITY: vulkreon

      - name: Commit now-playing.json if changed
        run: |
          if ! git diff --quiet -- now-playing.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add now-playing.json
            git commit -m "chore: update now-playing.json"
            git push
          else
            echo "No change"
          fi
